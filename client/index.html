<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hoe is het met Tsoby???</title>
  </head>
  <body>
    <div id="app">
      <header id="stats">
        <div class="stat">
          <label>Hunger</label>
          <div class="bar"><div id="hunger-fill" class="fill"></div></div>
        </div>
        <button id="notify-toggle" type="button" title="Get notified when Toby's very hungry" aria-label="Turn on hunger notifications">🔕</button>
        <button id="mute-toggle" type="button" title="Mute sounds" aria-label="Mute sounds">🔊</button>
      </header>

      <div id="scene">
        <div id="cat" title="Tap to wake him"></div>
        <div id="thought-bubble" class="thought-bubble hidden"></div>
        <div id="weight-readout" class="weight-readout hidden"></div>
      </div>

      <div id="tray">
        <div id="food-source" title="Drag the bowl to feed Toby"></div>
      </div>

      <p id="status"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
